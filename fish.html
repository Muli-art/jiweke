<body>

  <!-- Cart Section -->
  <section class="cart-section" id="cart-section">
    <div class="cart-icon" onclick="window.location.href='cart.html'">
      <img src="https://cdn-icons-png.flaticon.com/512/107/107831.png" alt="Cart" />
      <span class="cart-count" id="cart-count">0</span>
    </div>
  </section>

  <!-- Menu -->
  <div class="menu-container" id="menu-list"></div>

  <script>
    const menuItems = [
      { id: 1, name: "1 Kg Goat", price: 1200, img: "goat1.jpg" },
      { id: 2, name: "1/2KG Goat", price: 750, img: "goat 2.jpg" },
      { id: 3, name: "Goat Meat", price: 700, img: "Nyama choma 2.jpg" },
      { id: 4, name: "Full Goat", price: 13000, img: "Nyama choma 3.jpg" },
      { id: 5, name: "Half Goat", price: 7000, img: "Nyama choma 4.jpg" },
      { id: 6, name: "Kichwa & Matumbo", price: 500, img: "Nyama choma 1.jpg" },
      { id: 7, name: "Full Chicken Kienyeji", price: 2000, img: "Full kienyeji.jpg" },
      { id: 8, name: "1KG Pork", price: 1500, img: "pork 1.jpg" }
    ];

    const menuList = document.getElementById('menu-list');
    const cartCount = document.getElementById('cart-count');
    const cartSection = document.getElementById('cart-section');

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cartCount.textContent = cart.length;
    }

    function addToCart(item) {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.push(item);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
    }

    function renderMenu() {
      menuList.innerHTML = '';
      menuItems.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'menu-item';
        div.innerHTML = `
          <div class="offer-badge">OFFER</div>
          <img src="${item.img}" class="menu-image" alt="${item.name}" />
          <div class="menu-content">
            <div class="menu-title">${item.name}</div>
            <div class="menu-price">KSH ${item.price.toFixed(2)}</div>
            <button class="order-button" onclick='addToCart(${JSON.stringify(item)})'>Order</button>
          </div>
        `;
        menuList.appendChild(div);
      });
    }

    renderMenu();
    updateCartCount();

    // Floating behavior on scroll
    window.addEventListener('scroll', () => {
      if (window.scrollY > 80) {
        cartSection.classList.add('floating');
      } else {
        cartSection.classList.remove('floating');
      }
    });
  </script>
