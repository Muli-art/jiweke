<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Space - Jiweke Tavern</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .booking-container {
      background: #1c1c1c;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
      max-width: 500px;
      width: 90%;
      text-align: center;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 20px;
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    p {
      color: #bbb;
      margin-bottom: 25px;
      font-size: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, textarea, select {
      padding: 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
    }

    textarea {
      resize: none;
      height: 100px;
    }

    .btn {
      background: #d4af37;
      color: #111;
      border: none;
      padding: 14px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #fff;
      color: #d4af37;
      transform: scale(1.05);
    }

    .home-btn {
      display: inline-block;
      margin-top: 15px;
      background: #333;
      color: #fff;
      padding: 12px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .home-btn:hover {
      background: #d4af37;
      color: #111;
    }
  </style>
</head>
<body>

  <div class="booking-container">
    <h1>Book Your Space</h1>
    <p>Fill in the form below to reserve your spot at Jiweke Tavern.</p>

    <!-- Formspree Form -->
    <form id="bookingForm" action="https://formspree.io/f/xovnvqqg" method="POST">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="tel" name="phone" placeholder="Phone Number" required>
      <select name="event_type" required>
        <option value="">Select Event Type</option>
        <option value="Private Party">Private Party</option>
        <option value="Live Show">Live Show</option>
        <option value="Corporate Event">Corporate Event</option>
        <option value="Other">Other</option>
      </select>
      <input type="date" name="event_date" required>
      <textarea name="details" placeholder="Additional Details" required></textarea>
      <button type="submit" class="btn">Submit Booking</button>
    </form>

    <!-- Back to Home Button -->
    <a href="index.html" class="home-btn">⬅ Back to Home</a>
  </div>

  <script>
    // Redirect after submit
    const form = document.getElementById("bookingForm");
    form.addEventListener("submit", function(e) {
      e.preventDefault(); // stop default form action
      const formData = new FormData(form);
      fetch(form.action, {
        method: "POST",
        body: formData,
        headers: { 'Accept': 'application/json' }
      }).then(response => {
        if (response.ok) {
          alert("✅ Booking submitted successfully! Redirecting...");
          window.location.href = "index.html"; // redirect to home
        } else {
          alert("❌ Something went wrong. Please try again.");
        }
      }).catch(() => {
        alert("⚠️ Network error. Please check your connection.");
      });
    });
  </script>

</body>
</html>
