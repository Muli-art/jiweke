<body>

  <!-- Cart Section -->
  <section class="cart-section" id="cart-section">
    <div class="cart-icon" onclick="window.location.href='cart.html'">
      <img src="https://cdn-icons-png.flaticon.com/512/107/107831.png" alt="Cart" />
      <span class="cart-count" id="cart-count">0</span>
    </div>
  </section>

  <!-- Menu -->
  <div class="menu-container" id="menu-list"></div>

  <script>
    const menuItems = [
      { id: 1, name: "Mojito", price: 450, img: "https://images.unsplash.com/photo-1571074002524-3f22e09d2c46" },
      { id: 2, name: "Orange Juice", price: 250, img: "https://images.unsplash.com/photo-1606788075761-3c43c8f2b1c4" },
      { id: 3, name: "Craft Beer", price: 550, img: "https://images.unsplash.com/photo-1617196037304-8e90d518d4a6" },
      { id: 4, name: "Caffè Latte", price: 300, img: "https://images.unsplash.com/photo-1561047029-3000e82f47f5" },
      { id: 5, name: "Strawberry Smoothie", price: 350, img: "https://images.unsplash.com/photo-1590080876396-997a6eec8f47" },
      { id: 6, name: "Whiskey Sour", price: 600, img: "https://images.unsplash.com/photo-1601924582971-73e8e59e5c6b" },
      { id: 7, name: "Espresso", price: 200, img: "https://images.unsplash.com/photo-1511920170033-f8396924c348" },
      { id: 8, name: "Pina Colada", price: 500, img: "https://images.unsplash.com/photo-1551024601-bec78aea704b" }
    ];

    const menuList = document.getElementById('menu-list');
    const cartCount = document.getElementById('cart-count');
    const cartSection = document.getElementById('cart-section');

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cartCount.textContent = cart.length;
    }

    function addToCart(item) {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.push(item);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
    }

    function renderMenu() {
      menuList.innerHTML = '';
      menuItems.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'menu-item';
        div.innerHTML = `
          <img src="${item.img}" class="menu-image" alt="${item.name}" />
          <div class="menu-content">
            <div class="menu-title">${item.name}</div>
            <div class="menu-price">KSh ${item.price}</div>
            <button class="order-button" onclick='addToCart(${JSON.stringify(item)})'>Order</button>
          </div>
        `;
        menuList.appendChild(div);
      });
    }

    renderMenu();
    updateCartCount();

    // Floating behavior on scroll
    window.addEventListener('scroll', () => {
      if (window.scrollY > 80) {
        cartSection.classList.add('floating');
      } else {
        cartSection.classList.remove('floating');
      }
    });
  </script>
</body>
